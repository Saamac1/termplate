[package]
name = "termplate-shell"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "termplate"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.28", features = ["use-dev-tty"] }
libc = "0.2.191"
serde_json = "1.0.154"
termplate-core = { path = "../termplate-core" }
termplate-term = { path = "../termplate-term" }
